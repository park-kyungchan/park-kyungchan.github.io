<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>수학교육 영상</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
    button {
      position: fixed; z-index: 2; left: 50%; bottom: max(24px, env(safe-area-inset-bottom));
      translate: -50% 0; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
      padding: 11px 17px; color: #fff; background: rgba(0,0,0,.58); backdrop-filter: blur(12px);
      font: inherit; cursor: pointer;
    }
    button:hover { background: rgba(25,25,25,.78); }
    [hidden] { display: none; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; color: #aaa; }
  </style>
</head>
<body>
  <div id="status">영상 불러오는 중…</div>
  <video id="video" autoplay muted loop playsinline preload="auto" aria-label="수학교육 영상"></video>
  <button id="sound" type="button" hidden>소리 켜기</button>
  <button id="play" type="button" hidden>영상 재생</button>
  <script>
    const video = document.querySelector('#video');
    const status = document.querySelector('#status');
    const sound = document.querySelector('#sound');
    const play = document.querySelector('#play');

    async function loadVideo() {
      try {
        const response = await fetch('./media/manifest.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`manifest ${response.status}`);
        const { src, version } = await response.json();
        if (!/^\.\/[-a-zA-Z0-9_./]+\.mp4$/.test(src)) throw new Error('invalid video path');
        video.src = `${src}?v=${encodeURIComponent(version)}`;
        await video.play();
        status.hidden = true;
        sound.hidden = false;
      } catch (error) {
        status.hidden = true;
        play.hidden = false;
        console.error(error);
      }
    }

    sound.addEventListener('click', async () => {
      video.muted = !video.muted;
      sound.textContent = video.muted ? '소리 켜기' : '음소거';
      await video.play();
    });
    play.addEventListener('click', async () => {
      await video.play();
      play.hidden = true;
      sound.hidden = false;
    });
    loadVideo();
  </script>
</body>
</html>
