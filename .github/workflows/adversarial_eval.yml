name: 3D WebGL Adversarial Evaluation & Build Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  adversarial-eval:
    name: Run 3D WebGL Adversarial & Byte-Identity Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow

      - name: Install Playwright Browsers & System Dependencies
        run: |
          npx playwright install --with-deps chromium

      - name: Verify Build Byte-Identity Contract
        run: |
          python src/build.py --check

      - name: Run WU-1 Math Fuzzing Suite
        run: |
          python tests/math_fuzzing.py

      - name: Run WU-2 WebGL Context Loss & Restoration Suite
        run: |
          python tests/webgl_context_loss.py

      - name: Run WU-3 VRAM Memory Leak Audit
        run: |
          python tests/vram_memory_leak.py

      - name: Run WU-4 Event Flooding & Visual Regression Suite
        run: |
          xvfb-run python tests/event_flooding_visual.py
